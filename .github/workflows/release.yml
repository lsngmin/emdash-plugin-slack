name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true
        default: "0.1.1"
      dry_run:
        description: Run npm publish in dry-run mode
        required: true
        default: true
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - run: node -v && npm -v && pnpm -v

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Sync version into package.json and src/index.ts
        run: |
          VERSION=${{ steps.version.outputs.value }}
          pnpm version "$VERSION" --no-git-tag-version
          sed -i "s/version: \"[^\"]*\"/version: \"$VERSION\"/" src/index.ts

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Publish package
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm publish --access public --no-git-checks --provenance --dry-run
          else
            pnpm publish --access public --no-git-checks --provenance
          fi
